---
provisioner:
  playbooks:
    prepare: "${MOLECULE_PROJECT_DIRECTORY}/../../.config/molecule/alternative/prepare.yml"
  inventory:
    group_vars:
      all:
        meshtastic_exporter_web_listen_address:
          - '127.0.0.1:9464'
        meshtastic_exporter_textfile_dir: ""
        meshtastic_exporter_enabled_collectors:
          - entropy
        meshtastic_exporter_disabled_collectors:
          - diskstats
        meshtastic_exporter_tls_server_config:
          cert_file: /etc/meshtastic_exporter/tls.cert
          key_file: /etc/meshtastic_exporter/tls.key
        meshtastic_exporter_http_server_config:
          http2: true
        meshtastic_exporter_basic_auth_users:
          randomuser: examplepassword
