---
# yamllint disable rule:line-length
argument_specs:
  main:
    short_description: "Prometheus Meshtastic Exporter"
    description:
      - "Deploy prometheus L(dns exporter,https://github.com/hacktegic/meshtastic-prometheus-exporter) using ansible"
    author:
      - "Prometheus Community"
    options:
      meshtastic_exporter_web_listen_ip:
        description: "IP address for meshtastic_exporter to listen to"
        default: "127.0.0.1"
      meshtastic_exporter_web_listen_port:
        description: "Port for meshtastic_exporter to listen to"
        default: "15353"
      meshtastic_exporter_debug_enable:
        description: "Enable or not daemon debug"
        type: bool
        default: false
      meshtastic_exporter_home:
        description: "Home of meshtastic_exporter user and base file locations"
        default: "/var/lib/meshtastic_exporter"
      meshtastic_exporter_virtualenv:
        description: "Python virtualenv filepath for meshtastic_exporter"
        default: "/var/lib/meshtastic_exporter/venv"
      meshtastic_exporter_config_template:
        description: "Configuration template for meshtastic_exporter"
        default: "meshtastic_exporter.yml.j2"
      meshtastic_exporter_version:
        description: "DNS exporter package version. Also accepts latest as parameter."
        default: "1.0.0"
      meshtastic_exporter_web_listen_address:
        description: "Address on which dns exporter will listen"
        default: "0.0.0.0:15353"
      meshtastic_exporter_enabled_collectors:
        description:
          - "List of dicts defining additionally enabled collectors and their configuration."
          - "It adds collectors to L(those enabled by default,https://github.com/prometheus/meshtastic_exporter#enabled-by-default)."
        type: "list"
        default:
          - systemd
          - textfile:
              directory: "{{ meshtastic_exporter_textfile_dir }}"
      meshtastic_exporter_disabled_collectors:
        description:
          - "List of disabled collectors."
          - "By default meshtastic_exporter disables collectors listed L(here,https://github.com/prometheus/meshtastic_exporter#disabled-by-default)."
        type: "list"
        elements: "str"
      meshtastic_exporter_textfile_dir:
        description:
          - "Directory used by the L(Textfile Collector,https://github.com/prometheus/meshtastic_exporter#textfile-collector)."
          - "To get permissions to write metrics in this directory, users must be in C(meshtastic-exp) system group."
          - "B(Note:) More information in TROUBLESHOOTING.md guide."
        default: "/var/lib/meshtastic_exporter"
      meshtastic_exporter_tls_server_config:
        description:
          - "Configuration for TLS authentication."
          - "Keys and values are the same as in L(meshtastic_exporter docs,https://prometheus.io/docs/prometheus/latest/configuration/https/)."
        type: "dict"
      meshtastic_exporter_http_server_config:
        description:
          - "Config for HTTP/2 support."
          - "Keys and values are the same as in L(meshtastic_exporter docs,https://prometheus.io/docs/prometheus/latest/configuration/https/)."
        type: "dict"
      meshtastic_exporter_basic_auth_users:
        description: "Dictionary of users and password for basic authentication. Passwords are automatically hashed with bcrypt."
        type: "dict"
      meshtastic_exporter_system_group:
        description:
          - "I(Advanced)"
          - "System group for dns exporter"
        default: "meshtastic-exp"
      meshtastic_exporter_system_user:
        description:
          - "I(Advanced)"
          - "Meshtastic exporter user"
        default: "meshtastic-exp"
      meshtastic_exporter_config_dir:
        description: "Path to directory with meshtastic_exporter configuration"
        default: "/etc/default"
      meshtastic_exporter_config_template:
        description: "Template configuration for meshtastic_exporter"
        default: "meshtastic_exporter.j2"
      meshtastic_exporter_interface:
        description: "Type of interface to use by meshtastic_exporter, mqtt, ble, serial, or tcp"
        default: "mqtt"
      meshtastic_exporter_mqtt_address:
        description: "MQTT server to use when mqtt interface"
        default: "mqtt.meshtastic.org"
      meshtastic_exporter_mqtt_port:
        description: "MQTT server iport to use when mqtt interface"
        default: "1883"
      meshtastic_exporter_mqtt_tls:
        description: "MQTT TLS setting when mqtt interface"
        default: "0"
      meshtastic_exporter_mqtt_keepalive:
        description: "MQTT keepalive setting when mqtt interface"
        default: "15"
      meshtastic_exporter_mqtt_username:
        description: "MQTT username when mqtt interface"
        default: "meshdev"
      meshtastic_exporter_mqtt_password:
        description: "MQTT password setting when mqtt interface"
        default: ""
      meshtastic_exporter_mqtt_topic:
        description: "MQTT topic setting when mqtt interface"
        default: "msh/EU_433/#"
      meshtastic_exporter_ble_address:
        description: "Bluetooth address to connect when ble interface"
        default: "AA:BB:CC:DD:EE:FF"
      meshtastic_exporter_serial_device:
        description: "Serial device filepath to use when serial interface"
        default: "/dev/ttyUSB0"
