---
- name: Configure socket
  ansible.builtin.include_tasks: configure-socket.yml
  vars:
    _common_service_name: "jellyfin_exporter"

- name: Configure
  ansible.builtin.include_role:
    name: prometheus.prometheus._common
    tasks_from: configure.yml
  vars:
    _common_system_user: "{{ jellyfin_exporter_system_user }}"
    _common_system_group: "{{ jellyfin_exporter_system_group }}"
    _common_config_dir: "{{ jellyfin_exporter_config_dir }}"
    _common_tls_server_config: "{{ jellyfin_exporter_tls_server_config }}"
    _common_http_server_config: "{{ jellyfin_exporter_http_server_config }}"
    _common_basic_auth_users: "{{ jellyfin_exporter_basic_auth_users }}"
  tags:
    - jellyfin_exporter
    - configure
    - jellyfin_exporter_configure

- name: Create textfile collector dir
  ansible.builtin.file:
    path: "{{ jellyfin_exporter_textfile_dir }}"
    state: directory
    owner: "{{ jellyfin_exporter_system_user }}"
    group: "{{ jellyfin_exporter_system_group }}"
    mode: u+rwX,g+rwX,o=rX
  become: true
  when: jellyfin_exporter_textfile_dir | length > 0
  tags:
    - jellyfin_exporter
    - configure
    - jellyfin_exporter_configure

- name: Create default config file
  ansible.builtin.copy:
    path: "{{ jellyfin_exporter_cfg }}"
    content: |
      JELLYFIN_ADDRESS={{ jellyfin_exporter_jellyfin_url }}
      JELLYFIN_TOKEN={{ jellyfin_exporter_token }}
    state: present
    owner: "{{ jellyfin_exporter_system_user }}"
    group: "{{ jellyfin_exporter_system_group }}"
    mode: u+rwX,g+rwX,o=rX
  become: true
  when: jellyfin_exporter_textfile_dir | length > 0
  tags:
    - jellyfin_exporter
    - configure
    - jellyfin_exporter_configure
