---
provisioner:
  playbooks:
    prepare: "${MOLECULE_PROJECT_DIRECTORY}/../../.config/molecule/alternative/prepare.yml"
  inventory:
    group_vars:
      all:
        jellyfin_exporter_local_cache_path: "/tmp/jellyfin_exporter-linux-amd64"
        jellyfin_exporter_web_listen_address:
          - '127.0.0.1:8080'
          - '127.0.1.1:8080'
        jellyfin_exporter_textfile_dir: ""
        jellyfin_exporter_enabled_collectors:
          - entropy
        jellyfin_exporter_disabled_collectors:
          - diskstats
        jellyfin_exporter_tls_server_config:
          cert_file: /etc/jellyfin_exporter/tls.cert
          key_file: /etc/jellyfin_exporter/tls.key
        jellyfin_exporter_http_server_config:
          http2: true
        jellyfin_exporter_basic_auth_users:
          randomuser: examplepassword
        jellyfin_exporter_version: 1.5.2
        jellyfin_exporter_binary_url: "https://github.com/prometheus-community/jellyfin_exporter/releases/download/v{{\
                                   \ jellyfin_exporter_version }}/jellyfin_exporter-{{ jellyfin_exporter_version }}.linux-amd64.tar.gz"
