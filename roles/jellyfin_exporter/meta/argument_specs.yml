---
# yamllint disable rule:line-length
argument_specs:
  main:
    short_description: "Prometheus jellyfin Exporter"
    description:
      - "Deploy prometheus L(jellyfin exporter,https://github.com/rebelcore/jellyfin_exporter) using ansible"
    author:
      - "Prometheus Community"
    options:
      jellyfin_exporter_version:
        description: "jellyfin exporter package version. Also accepts latest as parameter."
        default: "1.5.2"
      jellyfin_exporter_binary_url:
        description: "URL of the jellyfin exporter binaries .tar.gz file"
        default: "https://github.com/{{ _jellyfin_exporter_repo }}/releases/download/v{{ jellyfin_exporter_version }}/jellyfin_exporter-{{ jellyfin_exporter_version }}.{{ ansible_facts['system'] | lower }}-{{ _jellyfin_exporter_go_ansible_arch }}.tar.gz"
      jellyfin_exporter_checksums_url:
        description: "URL of the jellyfin exporter checksums file"
        default: "https://github.com/{{ _jellyfin_exporter_repo }}/releases/download/v{{ jellyfin_exporter_version }}/sha256sums.txt"
      jellyfin_exporter_web_disable_exporter_metrics:
        description: "Exclude metrics about the exporter itself (promhttp_*, process_*, go_*)."
        type: bool
        default: false
      jellyfin_exporter_web_listen_address:
        description: "Address on which jellyfin exporter will listen"
        default: "0.0.0.0:9594"
      jellyfin_exporter_web_telemetry_path:
        description: "Path under which to expose metrics"
        default: "/metrics"
      jellyfin_exporter_enabled_collectors:
        description:
          - "List of dicts defining additionally enabled collectors and their configuration."
          - "It adds collectors to L(those enabled by default,https://github.com/rebelcore/jellyfin_exporter#enabled-by-default)."
        type: "list"
        default:
          - systemd
          - textfile:
              directory: "{{ jellyfin_exporter_textfile_dir }}"
      jellyfin_exporter_disabled_collectors:
        description:
          - "List of disabled collectors."
          - "By default jellyfin_exporter disables collectors listed L(here,https://github.com/rebelcore/jellyfin_exporter#disabled-by-default)."
        type: "list"
        elements: "str"
      jellyfin_exporter_textfile_dir:
        description:
          - "Directory used by the L(Textfile Collector,https://github.com/rebelcore/jellyfin_exporter#textfile-collector)."
          - "To get permissions to write metrics in this directory, users must be in C(jellyfin-exp) system group."
          - "B(Note:) More information in TROUBLESHOOTING.md guide."
        default: "/var/lib/jellyfin_exporter"
      jellyfin_exporter_tls_server_config:
        description:
          - "Configuration for TLS authentication."
          - "Keys and values are the same as in L(jellyfin_exporter docs,https://prometheus.io/docs/prometheus/latest/configuration/https/)."
        type: "dict"
      jellyfin_exporter_http_server_config:
        description:
          - "Config for HTTP/2 support."
          - "Keys and values are the same as in L(jellyfin_exporter docs,https://prometheus.io/docs/prometheus/latest/configuration/https/)."
        type: "dict"
      jellyfin_exporter_basic_auth_users:
        description: "Dictionary of users and password for basic authentication. Passwords are automatically hashed with bcrypt."
        type: "dict"
      jellyfin_exporter_binary_install_dir:
        description:
          - "I(Advanced)"
          - "Directory to install jellyfin_exporter binary"
        default: "/usr/local/bin"
      jellyfin_exporter_system_group:
        description:
          - "I(Advanced)"
          - "System group for jellyfin exporter"
        default: "jellyfin-exp"
      jellyfin_exporter_system_user:
        description:
          - "I(Advanced)"
          - "jellyfin exporter user"
        default: "jellyfin-exp"
      jellyfin_exporter_extra_args:
        description:
          - "I(Advanced)"
          - "jellyfin exporter cli extra arguments to be added to systemd unit"
        default: []
      jellyfin_exporter_local_cache_path:
        description: "Local path to stash the archive and its extraction"
        default: "/tmp/jellyfin_exporter-{{ ansible_facts['system'] | lower }}-{{ _jellyfin_exporter_go_ansible_arch }}/{{ jellyfin_exporter_version }}"
      jellyfin_exporter_config_dir:
        description: "Path to directory with jellyfin_exporter configuration"
        default: "/etc/jellyfin_exporter"
